name: Embed on merge

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      note:
        description: "Manual retry — embeds based on current manifest vs previous commit"
        required: false
        type: string

permissions:
  contents: write

jobs:
  embed:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'sync/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Production embed writes to the shared RAG index consumed by the extension.
    # Gating on an environment allows required-reviewer/wait-timer rules to be
    # attached in repo settings without a workflow change.
    environment: production-embed
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract pre-merge manifest
        run: |
          git show HEAD~1:manifest.json > manifest_old.json 2>/dev/null || echo '{"version":"1.0","frameworks":{}}' > manifest_old.json

      - name: Embed changes
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python scripts/embed_from_diff.py \
            --old-manifest manifest_old.json \
            --new-manifest manifest.json \
            --embed

      - name: Commit updated manifest
        run: |
          if [[ -n "$(git status --porcelain -- manifest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: update manifest with chunk IDs"
            git push
          else
            echo "No manifest changes (chunk_ids already populated or no embedding needed)."
          fi

      - name: Tag embedded
        run: |
          DATE_TAG="embedded/$(date +%Y-%m-%d)"
          git tag -f "$DATE_TAG"
          git tag -f "latest-embedded"
          git push origin "$DATE_TAG" --force
          git push origin "latest-embedded" --force
